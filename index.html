0 0 14px}.muted{color:var(--muted)}.sub{margin:4px 0 0;color:var(--muted)}.btn{background:var(--blue);border:1px solid var(--blue);color:white;border-radius:9px;padding:10px 14px;font-weight:700}.btn.secondary{background:#fff;color:var(--blue)}.btn.danger{background:#dc3545;border-color:#dc3545}.btn:disabled{opacity:.45;cursor:not-allowed}.cards{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:15px;margin-bottom:20px}.card,.panel{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);box-shadow:0 3px 14px #0d244309}.card{padding:18px}.card .val{font-size:27px;font-weight:850;margin-top:6px}.card .label{color:var(--muted);font-size:12px;font-weight:700}.panel{padding:20px;margin-bottom:20px}.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:18px}.controls{display:flex;flex-wrap:wrap;gap:10px;align-items:end;margin-bottom:15px}.field{display:flex;flex-direction:column;gap:5px;flex:1;min-width:150px}.field label{font-size:12px;font-weight:750;color:#5d6c82}input,select{padding:10px 11px;border:1px solid #cdd7e5;border-radius:9px;background:white;min-width:0;width:100%;color:var(--ink)}input[type=file]{padding:8px}.tablewrap{overflow:auto}table{border-collapse:collapse;width:100%;white-space:nowrap}th,td{padding:11px 13px;border-bottom:1px solid var(--border);text-align:left}th{background:#f6f8fc;color:#52627a;font-size:12px}td{font-size:13px}.tag{padding:4px 8px;border-radius:6px;background:#eaf1ff;color:#2556ae;font-weight:700;font-size:11px}.tag.pending{background:#fff1ce;color:#986000}.tag.approved{background:#ddf8e8;color:#137346}.tag.rejected{background:#ffe6e8;color:#b9273a}.notice{background:#eff6ff;border:1px solid #bcd4ff;border-radius:10px;padding:12px 14px;margin-bottom:16px;color:#254c84}.empty{text-align:center;padding:24px;color:var(--muted)}.models{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:12px}.model{background:#fff;border:2px solid var(--border);border-radius:12px;padding:12px;text-align:left}.model.selected{border-color:var(--blue)}.preview{height:72px;border-radius:7px;display:flex;overflow:hidden;background:#eef3fa;margin-bottom:8px}.preview b{display:block;width:27%;background:var(--previewnav,#102447)}.preview em{display:block;flex:1;background:var(--previewbg,#eef3fa);padding:9px}.preview em:before{content:'';display:block;height:9px;background:var(--previewaccent,#2563eb);border-radius:4px;width:60%}.model small{display:block;color:var(--muted)}.collapsed .sidebar{width:69px}.collapsed .sidebar .nav button span.txt,.collapsed .brand span,.collapsed .sidebar-foot{display:none}.collapsed .main{margin-left:69px}.collapsed .nav button{justify-content:center;padding:11px}.collapsed .brand{justify-content:center;padding:19px 8px}.collapsed .nav .sym{min-width:auto}.overlay{display:none}.login{position:fixed;inset:0;z-index:40;background:linear-gradient(125deg,#0d1f45,#1d57b9);display:flex;align-items:center;justify-content:center;padding:18px}.loginbox{background:white;border-radius:20px;padding:30px;width:min(440px,100%);box-shadow:0 25px 70px #0005}.loginbox h1{margin-bottom:8px}.loginbox .field{margin:16px 0}.loginbox .btn{width:100%}.small{font-size:12px}.hidden{display:none!important}body[data-model="2"]{--nav:#fff;--bg:#f2f6ff;--blue:#0c72de}body[data-model="2"] .sidebar{color:#18375b;border-right:1px solid #dce5f0}body[data-model="2"] .nav button{color:#50637b}body[data-model="2"] .nav button.active{color:white}body[data-model="2"] .sidebar-foot{color:#50637b}body[data-model="3"]{--nav:#142a32;--blue:#079e9d;--bg:#edf7f5}body[data-model="4"]{--nav:#24183c;--blue:#8052d9;--bg:#f6f2fb}body[data-model="5"]{--nav:#161d29;--blue:#ef7b25;--bg:#f9f6f1}body[data-model="6"]{--nav:#081f3d;--blue:#00a4cf;--bg:#edf5fb;--radius:5px}body[data-model="7"]{--nav:#14342c;--blue:#1d996a;--bg:#f0f8f3;--radius:20px}body[data-model="8"]{--nav:#301b27;--blue:#cc477b;--bg:#fbf2f6}body[data-model="9"]{--nav:#111827;--blue:#475569;--bg:#f8fafc;--radius:3px}body[data-model="10"]{--nav:#12295c;--blue:#e0a31b;--bg:#fffaf0}body[data-model="10"] .nav button.active{color:#17213c}@media(max-width:1100px){.cards{grid-template-columns:repeat(2,1fr)}.models{grid-template-columns:repeat(3,1fr)}}@media(max-width:760px){.sidebar{transform:translateX(-100%);width:270px!important}.main,.collapsed .main{margin-left:0}.app.mobile-open .sidebar{transform:translateX(0)}.app.mobile-open .overlay{display:block;position:fixed;inset:0;background:#0008;z-index:19}.collapsed .sidebar .nav button span.txt,.collapsed .brand span,.collapsed .sidebar-foot{display:initial}.collapsed .nav button{justify-content:flex-start}.content{padding:15px}.topbar{padding:0 12px}.grid2,.cards{grid-template-columns:1fr}.models{grid-template-columns:repeat(2,1fr)}}

</style></head><body data-model="1"><div id="login" class="login"><div class="loginbox"><h1>HAP HD Fresh Asset Portal</h1><p class="muted">10 navigation models · Admin & Sales Team</p><div class="notice small">DESIGN PREVIEW ONLY: Select a role and display name. This is not secure login or a shared cloud database.</div><div class="field"><label>Login role</label><select id="loginRole"><option value="admin">Admin</option><option value="sales">Sales Team</option></select></div><div class="field"><label>Display name</label><input id="loginName" value="Demo User" placeholder="Your name"></div><button class="btn" onclick="login()">Open Working Portal</button></div></div><div class="app" id="app"><aside class="sidebar"><div class="brand"><i>❄</i><span>HAP HD Fresh Asset Portal</span></div><div class="nav" id="nav"></div><div class="sidebar-foot">10 navigation models<br>Role-specific navigation · local preview</div></aside><div class="overlay" onclick="closeMobile()"></div><main class="main"><header class="topbar"><button class="hamburger" onclick="toggleMenu()" aria-label="Toggle sidebar">☰</button><div class="top-title" id="topTitle">Dashboard</div><span class="rolepill" id="roleLabel">ADMIN PORTAL</span><span class="role-user" id="roleUser"></span><button class="ghost" onclick="logout()">Log out</button></header><div class="content" id="content"></div></main></div><script>
const K='hdportal10_v1';let state={role:'admin',name:'Demo User',page:'dashboard',model:1,masters:{hd:[],asset:[],cfa:[]},requests:[],allocations:[]};try{let old=JSON.parse(localStorage.getItem(K));if(old)state={...state,...old,masters:{...state.masters,...old.masters}}}catch(e){};const save=()=>localStorage.setItem(K,JSON.stringify(state));const $=id=>document.getElementById(id);const safe=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const money=n=>'₹'+Number(n||0).toLocaleString('en-IN',{maximumFractionDigits:0});const n=v=>Number(String(v??0).replace(/[,₹ ]/g,''))||0;const field=(r,keys)=>{let entries=Object.entries(r);for(let key of keys){let hit=entries.find(([k])=>k.toLowerCase().replace(/[^a-z0-9]/g,'')===key.toLowerCase().replace(/[^a-z0-9]/g,''));if(hit)return hit[1]}return ''};const hdcode=r=>String(field(r,['HD Code','HDCode','Distributor Code','Customer Code','HD'])).trim();const capacity=r=>String(field(r,['Capacity','Asset Capacity','Cooler Capacity','Model','Asset Description'])).trim();const assetTag=r=>String(field(r,['Asset Tag Number','Asset Tag','Tag Number','Asset Code','Asset Number'])).trim();const assetValue=r=>n(field(r,['Asset Value','Asset Price','Book Value','Value','Price']));const hdName=r=>field(r,['HD Name','Distributor Name','Customer Name']);const cfaName=r=>field(r,['CFA','CFA Name','CFA Code','CFA Location']);const qty=r=>n(field(r,['Available Qty','Available Stock','Stock','Qty','Quantity']));
const cfaCode=r=>String(field(r,['CFA Code','CFA','CFA Name'])).trim();
const hdCFA=r=>String(field(r,['CFA Code','CFA','Assigned CFA'])).trim();
const receipt=r=>String(field(r,['Stock Receipt Date','Receipt Date','Received Date','Date'])).trim();
const stockAvailable=r=>{let st=String(field(r,['Stock Status','Status'])).toUpperCase().trim(),al=String(field(r,['Allocation Status'])).toUpperCase().trim();return (!st||['AVAILABLE','IN HAND','IN-HAND'].includes(st))&&(!al||['UNALLOCATED','AVAILABLE'].includes(al))};
const menus={admin:[['dashboard','▦','Dashboard'],['upload','⇧','Admin Excel Master Uploads'],['hd','⌕','HD Search & Complete Details'],['capacity','▤','Capacity-wise Cooler Summary'],['assets','◈','Asset Tag Details'],['approvals','✓','Admin Approvals'],['history','◷','Allocation History'],['alerts','⚠','Negative HD Balance Alerts'],['models','▥','10 Navigation Models']],sales:[['dashboard','▦','Dashboard'],['hd','⌕','HD Search & Complete Details'],['capacity','▤','Capacity-wise Cooler Summary'],['calculator','⊞','Cooler Request Calculator'],['stock','▣','CFA Available Stock'],['requests','✉','My Requests'],['approved','✓','Approved Qty by HD'],['alerts','⚠','Negative HD Balance Alerts'],['models','▥','10 Navigation Models']]};const titles=Object.fromEntries([...menus.admin,...menus.sales].map(x=>[x[0],x[2]]));function login(){state.role=$('loginRole').value;state.name=$('loginName').value.trim()||'Demo User';state.page='dashboard';save();$('login').classList.add('hidden');render()}function logout(){$('login').classList.remove('hidden');$('loginRole').value=state.role;$('loginName').value=state.name}function toggleMenu(){if(innerWidth<=760)$('app').classList.toggle('mobile-open');else $('app').classList.toggle('collapsed')}function closeMobile(){$('app').classList.remove('mobile-open')}function go(p){state.page=p;save();closeMobile();render()}function setModel(i){state.model=i;save();render()}function render(){if(!menus[state.role].some(x=>x[0]===state.page))state.page='dashboard';document.body.dataset.model=state.model;$('roleLabel').textContent=state.role==='admin'?'ADMIN PORTAL':'SALES TEAM PORTAL';$('roleUser').textContent=state.name;$('topTitle').textContent=titles[state.page];$('nav').innerHTML=menus[state.role].map(([id,icon,title])=>`<button class="${state.page===id?'active':''}" onclick="go('${id}')" title="${safe(title)}"><span class="sym">${icon}</span><span class="txt">${safe(title)}</span></button>`).join('');$('content').innerHTML=page();}function title(t,desc){return `<div class="heading"><div><h1>${t}</h1><p class="sub">${desc}</p></div></div>`}function card(label,val){return `<div class="card"><div class="label">${safe(label)}</div><div class="val">${safe(val)}</div></div>`}function table(rows,columns){if(!rows.length)return '<div class="empty">No records yet. Upload Excel masters or submit a request to populate this section.</div>';return `<div class="tablewrap"><table><thead><tr>${columns.map(x=>`<th>${safe(x[0])}</th>`).join('')}</tr></thead><tbody>${rows.map(r=>`<tr>${columns.map(([_,fn])=>`<td>${fn(r)}</td>`).join('')}</tr>`).join('')}</tbody></table></div>`}function computed(){const hd=state.masters.hd,assets=state.masters.asset;let map={};for(let a of assets){let code=hdcode(a);if(!code)continue;(map[code]??={count:0,value:0,assets:[]}).count++;map[code].value+=assetValue(a);map[code].assets.push(a)}return hd.map(r=>{let code=hdcode(r),v=map[code]||{count:0,value:0,assets:[]};let deposit=n(field(r,['Total Deposit','Total Deposit Value','Deposit','Total Deposite Value']));
 let security=n(field(r,['Security Deposit','Security Deposite','Security Deposit Value']));
 let reserved=state.requests.filter(x=>x.hd===code&&['Pending','Approved'].includes(x.status)).reduce((sum,x)=>sum+n(x.total),0);
 return {code,name:hdName(r),rsm:field(r,['RSM','RSM Name']),sdm:field(r,['SDM','SDM Name']),location:field(r,['Location','City']),deposit,security,assetCount:v.count,assetValue:v.value,balance:deposit-security-v.value-reserved,original:deposit-security-v.value,reserved}})}function hcols(){return [['HD Code',r=>safe(r.code)],['HD Name',r=>safe(r.name)],['RSM',r=>safe(r.rsm)],['Location',r=>safe(r.location)],['Asset Count',r=>r.assetCount],['Asset Value',r=>money(r.assetValue)],['Total Deposit',r=>money(r.deposit)],['Security Deposit',r=>money(r.security)],['Available Balance',r=>`<strong style="color:${r.balance<0?'#d03445':'#158052'}">${money(r.balance)}</strong>`]]}function page(){let h=computed(),neg=h.filter(r=>r.balance<0),req=state.requests,assets=state.masters.asset;if(state.page==='dashboard')return title('Overview Dashboard','Live calculations from uploaded local Excel data')+`<div class="cards">${card('HD Masters',h.length)}${card('Total Asset Tags',assets.length)}${card('Total Asset Value',money(assets.reduce((s,a)=>s+assetValue(a),0)))}${card('Pending Requests',req.filter(r=>r.status==='Pending').length)}</div><div class="grid2"><section class="panel"><h2>HD Balance Summary</h2>${table(h.slice(0,8),hcols())}</section><section class="panel"><h2>Recent Cooler Requests</h2>${requestTable(req.slice(-8).reverse(),false)}</section></div><div class="notice">Choose “10 Navigation Models” to preview and switch designs. All uploaded data stays in this browser profile.</div>`;if(state.page==='models'){let names=['Classic Corporate Blue','Light Office Sidebar','Teal Operations','Purple Analytics','Orange Industrial','Compact ERP','Green Rounded','Rose Workspace','Minimal Slate','Gold Executive'];let navs=['#0e1c37','#ffffff','#142a32','#24183c','#161d29','#081f3d','#14342c','#301b27','#111827','#12295c'];let colors=['#2563eb','#0c72de','#079e9d','#8052d9','#ef7b25','#00a4cf','#1d996a','#cc477b','#475569','#e0a31b'];return title('10 Navigation Models','Select any model to apply its sidebar, cards and application theme instantly')+`<div class="panel"><div class="models">${names.map((name,i)=>`<button class="model ${state.model===i+1?'selected':''}" onclick="setModel(${i+1})"><div class="preview" style="--previewnav:${navs[i]};--previewaccent:${colors[i]}"><b></b><em></em></div><strong>${String(i+1).padStart(2,'0')} · ${name}</strong><small>${state.model===i+1?'✓ Active design':'Click to activate'}</small></button>`).join('')}</div></div><div class="panel"><h2>Available Working Navigation</h2>${table(menus[state.role].map((m,i)=>({num:i+1,label:m[2]})),[['#',r=>r.num],['Page',r=>safe(r.label)]])}</div>`}if(state.page==='upload')return title('Admin Excel Master Uploads','Import Excel or CSV masters · all calculations refresh after upload')+`<div class="notice">Excel (.xlsx/.xls) parsing uses the SheetJS library loaded from a CDN and needs internet on first use. CSV works offline. Data remains in localStorage and is not shared with other users.</div><div class="grid2">${[['hd','HD Master','HD Code, HD Name, RSM, SDM, Location, Total Deposit, Security Deposit'],['asset','Asset Master','HD Code, Asset Tag Number, Asset Capacity, Asset Value'],['cfa','CFA Stock Master','CFA, Capacity, Available Qty']].map(([id,label,cols])=>`<div class="panel"><h2>${label}</h2><p class="muted small">Expected columns: ${cols}</p><input type="file" id="file_${id}" accept=".xlsx,.xls,.csv"><div class="controls" style="margin-top:12px"><button class="btn" onclick="upload('${id}')">Import ${label}</button><button class="btn secondary" onclick="downloadTemplate('${id}')">Download CSV Template</button></div><p class="muted">Current records: ${state.masters[id].length}</p></div>`).join('')}</div>`;if(state.page==='hd')return title('HD Search & Complete Details','Merged HD master, asset counts, deposits and balance')+`<div class="panel"><div class="controls"><div class="field"><label>Search HD code, name, RSM or location</label><input id="searchHD" oninput="filterHD()" placeholder="Type HD Code or Name"></div></div><div id="hdResults">${table(h,hcols())}</div></div>`;if(state.page==='capacity'){let m={};for(let a of assets){let c=capacity(a)||'Not Specified';(m[c]??={capacity:c,count:0,max:0,value:0}).count++;m[c].max=Math.max(m[c].max,assetValue(a));m[c].value+=assetValue(a)}return title('Capacity-wise Cooler Summary','Capacity quantities and maximum unit prices from Asset Master')+`<div class="cards">${card('Capacity Models',Object.keys(m).length)}${card('Asset Quantity',assets.length)}${card('Total Asset Value',money(assets.reduce((s,a)=>s+assetValue(a),0)))}${card('Pending Cooler Qty',req.filter(r=>r.status==='Pending').reduce((s,r)=>s+r.qty,0))}</div><div class="panel">${table(Object.values(m),[['Capacity',r=>safe(r.capacity)],['Assets',r=>r.count],['Max Unit Price',r=>money(r.max)],['Total Value',r=>money(r.value)]])}</div>`}if(state.page==='assets')return title('Asset Tag Details','Search and inspect individual asset records')+`<div class="panel"><div class="controls"><div class="field"><label>Search tag, HD or capacity</label><input id="searchAsset" oninput="filterAssets()" placeholder="Asset tag / HD code"></div></div><div id="assetResults">${assetTable(assets)}</div></div>`;if(state.page==='alerts')return title('Negative HD Balance Alerts','HDs where asset value exceeds total deposits')+`<div class="cards">${card('Negative HDs',neg.length)}${card('Total Shortfall',money(neg.reduce((s,r)=>s+Math.abs(r.balance),0)))}</div><div class="panel">${table(neg,hcols())}</div>`;if(state.page==='stock')return title('CFA Available Stock','Available stock from uploaded CFA master')+`<div class="panel">${table(state.masters.cfa.filter(stockAvailable),[['CFA',r=>safe(cfaCode(r))],['Capacity',r=>safe(capacity(r))],['Available Qty',r=>qty(r)||1]])}</div>`;if(state.page==='calculator')return title('Cooler Request Calculator','Select HD and capacity to calculate value using the maximum asset master price')+`<div class="grid2"><div class="panel"><h2>New Cooler Request</h2><div class="field"><label>HD</label><select id="requestHD" onchange="syncRequestCFA();updateCalc()">${h.map(r=>`<option value="${safe(r.code)}">${safe(r.code+' · '+r.name)}</option>`).join('')}</select></div><div class="field"><label>CFA</label><select id="requestCFA" disabled><option value="">Select HD</option></select></div><div class="field"><label>Capacity</label><select id="requestCapacity" onchange="updateCalc()">${[...new Set(assets.map(capacity).filter(Boolean))].map(x=>`<option>${safe(x)}</option>`).join('')}</select></div><div class="field"><label>Quantity</label><input id="requestQty" type="number" min="1" value="1" oninput="updateCalc()"></div><p id="calculatedValue" class="notice">Select capacity to calculate.</p><button class="btn" onclick="submitRequest()" ${!h.length||!assets.length?'disabled':''}>Submit Cooler Request</button></div><div class="panel"><h2>HD Balance Reference</h2>${table(h.slice(0,12),[['HD Code',r=>safe(r.code)],['HD Name',r=>safe(r.name)],['Balance',r=>money(r.balance)]])}</div></div>`;if(state.page==='requests')return title('My Requests','Requests created in this browser by your Sales Team login')+`<div class="panel">${requestTable(req.filter(r=>r.by===state.name).reverse(),false)}</div>`;if(state.page==='approved')return title('Approved Qty by HD','Approved cooler requests summarized by HD and capacity')+`<div class="panel">${table(req.filter(r=>r.status==='Approved'),[['HD',r=>safe(r.hd)],['Capacity',r=>safe(r.capacity)],['Approved Qty',r=>r.qty],['CFA',r=>safe(r.cfa)],['Value',r=>money(r.total)]])}</div>`;if(state.page==='approvals')return title('Admin Approvals','Approve or reject pending cooler requests')+`<div class="panel">${requestTable(req.slice().reverse(),true)}</div>`;if(state.page==='history')return title('Allocation History','FIFO asset tag allocation records')+`<div class="controls"><button class="btn" onclick="exportHistory()">Download Allocation History CSV</button></div><div class="panel">${table(state.allocations.slice().reverse(),[['Date',r=>safe(r.date)],['HD',r=>safe(r.hd)],['Capacity',r=>safe(r.capacity)],['Asset Tag',r=>safe(r.tag)],['Request',r=>safe(r.request)]])}</div>`;return ''}function exportHistory(){if(state.role!=='admin')return alert('Admin access only.');const head=['Request ID','HD Code','CFA','Capacity','Asset Tag','Allocated At','Approved By'];const escCSV=x=>'"'+String(x??'').replace(/"/g,'""')+'"';let rows=state.allocations.map(a=>[a.request,a.hd,a.cfa||'',a.capacity,a.tag,a.date,a.approvedBy||'']);let csv='\ufeff'+[head,...rows].map(r=>r.map(escCSV).join(',')).join('\r\n');let url=URL.createObjectURL(new Blob([csv],{type:'text/csv;charset=utf-8'}));let a=document.createElement('a');a.href=url;a.download='HAP_Allocation_History.csv';a.click();setTimeout(()=>URL.revokeObjectURL(url),1500)}
function requestTable(rows,admin){return table(rows,[['Request ID',r=>safe(r.id)],['HD',r=>safe(r.hd)],['Capacity',r=>safe(r.capacity)],['Qty',r=>r.qty],['Amount',r=>money(r.total)],['Status',r=>`<span class="tag ${r.status.toLowerCase()}">${safe(r.status)}</span>`],...(admin?[['Action',r=>r.status==='Pending'?`<button class="btn" onclick="decide('${r.id}','Approved')">Approve</button> <button class="btn danger" onclick="decide('${r.id}','Rejected')">Reject</button>`:r.status==='Approved'?`<button class="btn secondary" onclick="allocate('${r.id}')">Allocate FIFO</button>`:'—']]:[])])}function assetTable(rows){return table(rows,[['Asset Tag',r=>safe(assetTag(r))],['HD Code',r=>safe(hdcode(r))],['Capacity',r=>safe(capacity(r))],['Value',r=>money(assetValue(r))]])}function filterHD(){let q=$('searchHD').value.toLowerCase();$('hdResults').innerHTML=table(computed().filter(r=>[r.code,r.name,r.rsm,r.location].some(x=>String(x).toLowerCase().includes(q))),hcols())}function filterAssets(){let q=$('searchAsset').value.toLowerCase();$('assetResults').innerHTML=assetTable(state.masters.asset.filter(r=>[assetTag(r),hdcode(r),capacity(r)].some(x=>String(x).toLowerCase().includes(q))))}function syncRequestCFA(){let r=state.masters.hd.find(x=>hdcode(x)===$('requestHD')?.value);let c=r?hdCFA(r):'';if($('requestCFA'))$('requestCFA').innerHTML=`<option value="${safe(c)}">${safe(c||'Not mapped')}</option>`}
function updateCalc(){let c=$('requestCapacity')?.value,q=n($('requestQty')?.value);let max=Math.max(0,...state.masters.asset.filter(a=>capacity(a)===c).map(assetValue));if($('calculatedValue'))$('calculatedValue').textContent=`Maximum unit price ${money(max)} × ${q} = ${money(max*q)}`}function submitRequest(){if(state.role!=='sales')return alert('Sales Team access only.');syncRequestCFA();let hd=$('requestHD').value,c=$('requestCapacity').value,q=n($('requestQty').value);if(!hd||!c||!Number.isInteger(q)||q<1)return alert('Select an HD, capacity and positive whole quantity.');let max=Math.max(0,...state.masters.asset.filter(a=>capacity(a)===c).map(assetValue));let balance=computed().find(x=>x.code===hd)?.balance??0;if(q*max>balance)return alert('Request exceeds available HD balance.');let r={id:'REQ'+Date.now(),hd,capacity:c,qty:q,cfa:$('requestCFA').value,total:q*max,status:'Pending',by:state.name,date:new Date().toLocaleString('en-IN')};state.requests.push(r);save();go('requests');alert('Request saved locally. Admin can approve in this browser profile.')}function decide(id,status){if(state.role!=='admin')return alert('Admin access only.');let r=state.requests.find(x=>x.id===id);if(!r||r.status!=='Pending')return;r.status=status;save();render()}function allocate(id){if(state.role!=='admin')return alert('Admin access only.');let r=state.requests.find(x=>x.id===id);if(!r||r.status!=='Approved')return;let used=new Set(state.allocations.map(a=>a.tag));let available=state.masters.cfa.filter(a=>capacity(a)===r.capacity&&assetTag(a)&&!used.has(assetTag(a))&&stockAvailable(a)&&(!r.cfa||cfaCode(a)===r.cfa)).sort((a,b)=>{let da=Date.parse(receipt(a)),db=Date.parse(receipt(b));return (Number.isFinite(da)?da:Infinity)-(Number.isFinite(db)?db:Infinity)||assetTag(a).localeCompare(assetTag(b),undefined,{numeric:true})});let existing=state.allocations.filter(a=>a.request===id).length,need=r.qty-existing;if(need<=0)return alert('Already fully allocated.');if(available.length<need)return alert(`Only ${available.length} unassigned tags available for ${need} requested. Upload available CFA stock asset tags with Stock Receipt Date before allocating.`);for(let a of available.slice(0,need))state.allocations.push({request:id,hd:r.hd,capacity:r.capacity,tag:assetTag(a),date:new Date().toISOString(),cfa:r.cfa,approvedBy:state.name});save();render();alert(need+' asset tags allocated in local demo.')}const headers={hd:['HD Code','HD Name','RSM','SDM','Location','Total Deposit','Security Deposit'],asset:['HD Code','Asset Tag Number','Asset Capacity','Asset Value'],cfa:['CFA Code','Asset Tag Number','Cooler Capacity','Stock Receipt Date','Stock Status','Allocation Status']};function downloadTemplate(type){let csv=headers[type].join(',')+'\r\n';let blob=new Blob([csv],{type:'text/csv;charset=utf-8'}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download=type+'_master_template.csv';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000)}function parseCSV(text){let rows=[],row=[],cell='',quoted=false;for(let i=0;i<text.length;i++){let ch=text[i];if(ch==='"'){if(quoted&&text[i+1]==='"'){cell+='"';i++}else quoted=!quoted}else if(ch===','&&!quoted){row.push(cell);cell=''}else if((ch==='\n'||ch==='\r')&&!quoted){if(ch==='\r'&&text[i+1]==='\n')i++;row.push(cell);if(row.some(x=>x!==''))rows.push(row);row=[];cell=''}else cell+=ch}row.push(cell);if(row.some(x=>x!==''))rows.push(row);let head=(rows.shift()||[]).map(x=>x.trim());return rows.map(row=>Object.fromEntries(head.map((k,i)=>[k,row[i]||''])))}async function upload(type){if(state.role!=='admin')return alert('Admin access only.');let file=$('file_'+type).files[0];if(!file)return alert('Choose a file first.');try{let rows;if(file.name.toLowerCase().endsWith('.csv'))rows=parseCSV(await file.text());else{if(typeof XLSX==='undefined')throw Error('Excel parser not loaded. Connect to internet and refresh, or import CSV.');let book=XLSX.read(await file.arrayBuffer(),{type:'array'});rows=book.SheetNames.flatMap(s=>XLSX.utils.sheet_to_json(book.Sheets[s],{defval:''}))}if(!rows.length)throw Error('No data rows found.');let expected=headers[type][0].toLowerCase().replace(/[^a-z0-9]/g,'');let keys=Object.keys(rows[0]).map(x=>x.toLowerCase().replace(/[^a-z0-9]/g,''));if(!keys.includes(expected))throw Error('Missing required header: '+headers[type][0]);if(!confirm(`Replace ${state.masters[type].length} existing ${type} records with ${rows.length} imported records?`))return;state.masters[type]=rows;try{save()}catch(e){alert('Browser storage quota exceeded. Import a smaller file or use a server-backed application.');return}render();alert('Imported '+rows.length+' rows successfully.')}catch(e){alert('Import failed: '+e.message)}}window.addEventListener('resize',()=>{if(innerWidth>760)closeMobile()});$('loginRole').value=state.role;$('loginName').value=state.name;render();
</script><script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script></body></html>
